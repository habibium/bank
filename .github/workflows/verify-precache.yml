name: Verify precache

# Pages deploys this branch as-is (legacy build), so a stale committed sw.js would
# ship a precache manifest that no longer matches the files being served.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Regenerate sw.js
        run: node tools/gen-sw.mjs

      - name: Fail if sw.js is out of date
        run: |
          if ! git diff --quiet -- sw.js; then
            echo "::error file=sw.js::sw.js is stale. Run 'node tools/gen-sw.mjs' and commit the result."
            git --no-pager diff -- sw.js
            exit 1
          fi
